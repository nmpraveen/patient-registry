{% if page_obj.has_other_pages %}
<nav aria-label="Reminders pagination" class="d-flex gap-3 align-items-center">
  {% if page_obj.has_previous %}<a href="?page={{ page_obj.previous_page_number }}{% if status %}&amp;status={{ status }}{% endif %}">Previous</a>{% endif %}
  <span>{{ page_obj.number }} / {{ page_obj.paginator.num_pages }}</span>
  {% if page_obj.has_next %}<a href="?page={{ page_obj.next_page_number }}{% if status %}&amp;status={{ status }}{% endif %}">Next</a>{% endif %}
</nav>
{% endif %}
