services:
  web:
    environment:
      MEDTRACK_REQUIRE_TRUSTED_PROXY: "1"
      MEDTRACK_EXPECTED_PROXY_IP: 172.30.0.10
      MEDTRACK_TRUSTED_PROXY_CIDRS: ${MEDTRACK_TRUSTED_PROXY_CIDRS:-172.30.0.10/32}
    networks:
      default: {}
      medtrack_edge: {}

  caddy:
    image: medtrack-caddy:2.11.4-ratelimit
    build:
      context: .
      dockerfile: deploy/Dockerfile.caddy
    restart: unless-stopped
    environment:
      MEDTRACK_DOMAIN: ${MEDTRACK_DOMAIN:?set MEDTRACK_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - "${MEDTRACK_SECURITY_LOG_DIR:-./security-logs}:/var/log/medtrack"
    depends_on:
      web:
        condition: service_healthy
    networks:
      medtrack_edge:
        ipv4_address: 172.30.0.10
    healthcheck:
      test: ["CMD-SHELL", "caddy list-modules | grep -Fxq http.handlers.rate_limit && caddy validate --config /etc/caddy/Caddyfile"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  caddy_data:
  caddy_config:

networks:
  medtrack_edge:
    ipam:
      config:
        - subnet: 172.30.0.0/24
