name: Supply-chain freshness

on:
  schedule:
    - cron: "17 12 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  freshness:
    name: Dependency and image freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
      - uses: ./.github/actions/verify-exact-head
        with:
          expected-sha: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.13"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: python -m pip install --require-hashes -r requirements-ci.txt
      - run: python -m pip_audit --strict --require-hashes -r requirements.txt
      - run: python scripts/check_image_digests.py --remote
      - name: Confirm lock regeneration is reproducible
        run: |
          python scripts/update-python-locks.py
          git diff --exit-code -- requirements.txt requirements-ci.txt
