name: Supply-chain freshness

on:
  schedule:
    - cron: "17 12 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  freshness:
    name: Dependency and image freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: ./.github/actions/verify-exact-head
        with:
          expected-sha: ${{ github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.15"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: python -m pip install "pip @ https://files.pythonhosted.org/packages/3f/06/3e4420302363fbb71be3c7f35ce042f54bfca330e3e66b3a2e3c4cca579f/pip-26.2.2-py3-none-any.whl#sha256=fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70"
      - run: python -m pip install --require-hashes -r requirements-ci.txt
      - run: python -m pip_audit --strict --require-hashes -r requirements.txt
      - run: python scripts/check_image_digests.py --remote
      - name: Confirm lock regeneration is reproducible
        run: |
          python scripts/update-python-locks.py
          git diff --exit-code -- requirements.txt requirements-ci.txt
